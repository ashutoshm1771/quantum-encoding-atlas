    - Benchmarking: tutorials/benchmarking.md
    - Hardware Considerations: tutorials/hardware-considerations.md
  - Notebooks:
    - notebooks/index.md
    - Amplitude: notebooks/amplitude_encoding.ipynb
    - Angle: notebooks/angle_encoding.ipynb
    - Basis: notebooks/basis_encoding.ipynb
    - IQP: notebooks/iqp_encoding.ipynb
    - ZZ Feature Map: notebooks/zz_feature_map.ipynb
    - Pauli Feature Map: notebooks/pauli_feature_map.ipynb
    - Data Re-uploading: notebooks/data_reuploading.ipynb
    - Hardware Efficient: notebooks/hardware_efficient_encoding.ipynb
    - Higher-Order Angle: notebooks/higher_order_angle_encoding.ipynb
    - QAOA-Inspired: notebooks/qaoa_encoding.ipynb
    - Hamiltonian: notebooks/hamiltonian_encoding.ipynb
