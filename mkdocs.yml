    - Release Process: contributing/release-process.md

extra:
  generator: false
  status:
    new: Recently added
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/encoding-atlas/quantum-encoding-atlas
      name: Quantum Encoding Atlas on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/encoding-atlas/
      name: Quantum Encoding Atlas on PyPI
  version:
    provider: mike
  tags:
    Entangling: entangling
    Simulable: simulable
    Variational: variational
    Equivariant: equivariant
    Hardware-Friendly: hardware-friendly
