site_name: Quantum Encoding Atlas
site_url: https://ashutoshm1771.github.io/quantum-encoding-atlas/
site_description: A comprehensive library for quantum data encodings in machine learning
site_author: Ashutosh Mishra
repo_url: https://github.com/ashutoshm1771/quantum-encoding-atlas
repo_name: quantum-encoding-atlas
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Ashutosh Mishra

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            docstring_section_style: spacy
            merge_init_into_class: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Concepts:
    - concepts/index.md
    - What is Encoding?: concepts/what-is-encoding.md
    - Encoding Properties: concepts/encoding-properties.md
    - Quantum Advantage: concepts/quantum-advantage.md
  - Encodings:
    - encodings/index.md
    - Amplitude: encodings/amplitude.md
    - Angle: encodings/angle.md
    - IQP: encodings/iqp.md
    - ZZ Feature Map: encodings/zz-feature-map.md
    - Basis: encodings/basis.md
    - Data Re-uploading: encodings/data-reuploading.md
    - Hardware Efficient: encodings/hardware-efficient.md
    - Pauli Feature Map: encodings/pauli-feature-map.md
  - Tutorials:
    - tutorials/index.md
    - Getting Started: tutorials/getting-started.md
    - Comparing Encodings: tutorials/comparing-encodings.md
    - Custom Encodings: tutorials/custom-encoding.md
    - Benchmarking: tutorials/benchmarking.md
    - Hardware Considerations: tutorials/hardware-considerations.md
  - API Reference: api/
  - Decision Guide:
    - guide/index.md
    - Which Encoding?: guide/which-encoding.md
    - Decision Flowchart: guide/decision-flowchart.md
    - FAQ: guide/faq.md
  - Contributing:
    - contributing/index.md
    - Development Setup: contributing/development-setup.md
    - Adding Encodings: contributing/adding-encodings.md
    - Code Style: contributing/code-style.md
    - Release Process: contributing/release-process.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ashutoshm1771/quantum-encoding-atlas
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/encoding-atlas/
  version:
    provider: mike
