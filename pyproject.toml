[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "encoding-atlas"
dynamic = ["version"]
description = "A comprehensive library for quantum data encodings in machine learning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Ashutosh Mishra", email = "ashutoshm1771@gmail.com"},
]
maintainers = [
    {name = "Ashutosh Mishra", email = "ashutoshm1771@gmail.com"},
]
keywords = [
    "quantum computing",
    "quantum machine learning",
    "qml",
    "data encoding",
    "feature maps",
    "pennylane",
    "qiskit",
    "cirq",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.21.0,<3.0.0",
    "scipy>=1.7.0",
    "pennylane>=0.33.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
qiskit = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.13.0",
]
cirq = [
    "cirq-core>=1.0.0",
]
visualization = [
    "matplotlib>=3.5.0",
]
all = [
    "encoding-atlas[qiskit,cirq,visualization]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.0.0",
    "hypothesis>=6.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "nox>=2023.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-jupyter>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/ashutoshm1771/quantum-encoding-atlas"
Documentation = "https://ashutoshm1771.github.io/quantum-encoding-atlas/"
Repository = "https://github.com/ashutoshm1771/quantum-encoding-atlas.git"
Issues = "https://github.com/ashutoshm1771/quantum-encoding-atlas/issues"
Changelog = "https://github.com/ashutoshm1771/quantum-encoding-atlas/blob/master/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
encoding_atlas = ["py.typed"]

[tool.setuptools_scm]
write_to = "src/encoding_atlas/_version.py"

# ============ TOOL CONFIGURATIONS ============

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "B023",   # function-uses-loop-variable (review later)
    "C408",   # unnecessary-collection-call (review later)
    "F841",   # unused-variable (review later — may have side effects)
    "F401",   # unused-import (review later — may be side-effect imports)
    "B904",   # raise-without-from-inside-except (review later)
    "E721",   # type-comparison (review later — isinstance not always equivalent)
    "SIM105", # suppressible-exception (review later)
    "E402",   # module-import-not-at-top-of-file (review later)
    "E741",   # ambiguous-variable-name (review later)
    "ARG001", # unused-function-argument (review later)
    "ARG002", # unused-method-argument (review later)
    "E711",   # none-comparison (review later)
    "SIM103", # needless-bool (review later)
    "UP007",  # non-pep604-annotation (review later — breaks Python 3.9)
    "UP028",  # yield-in-for-loop (review later)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py are fine
"tests/*" = ["ARG"]       # unused arguments in tests are fine
"_version.py" = ["UP035", "UP006", "I001"]  # auto-generated by setuptools-scm

[tool.ruff.isort]
known-first-party = ["encoding_atlas"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pennylane.*",
    "qiskit.*",
    "cirq.*",
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "memory: marks memory-intensive tests (run weekly)",
    "backend_pennylane: tests requiring PennyLane backend",
    "backend_qiskit: tests requiring Qiskit backend",
    "backend_cirq: tests requiring Cirq backend",
    "requires_qiskit: marks tests that require qiskit",
    "requires_cirq: marks tests that require cirq",
    "numerical_stability: tests for numerical edge cases",
    "cross_backend: tests comparing results across backends",
    "serialization: tests for pickle/JSON serialization",
    "thread_safety: tests for concurrent access safety",
    "performance: marks performance benchmark tests",
    "scalability: marks scalability tests for large inputs",
    "documentation: marks documentation/docstring tests",
    "custom_threshold: tests for custom binarization threshold functionality",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/encoding_atlas"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 80
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests", "docs"]
