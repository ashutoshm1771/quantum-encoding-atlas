# .github/workflows/ci.yml
#
# Continuous Integration: runs on every push and pull request.
# Tests the package across Python versions and operating systems,
# enforces code quality (linting, formatting, type checking),
# and verifies the package builds correctly.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff (linting)
        run: ruff check src tests

      - name: Black (formatting)
        run: black --check src tests

      - name: mypy (type checking)
        run: mypy src

  # ── Job 2: Test ─────────────────────────────────────────────
  test:
    name: Test / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 30

    # Refuse to start if any advertised backend failed to install. Without this
    # a backend that did not install merely turns its tests into skips, and the
    # run stays green having verified far less than it appears to. Enforced by
    # tests/conftest.py::pytest_configure, so the rule is identical on every
    # platform and reproducible locally. See tests/_backends.py.
    env:
      ENCODING_ATLAS_REQUIRE_ALL_BACKENDS: "1"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install every backend the package advertises. Previously only
          # qiskit was installed, so all Cirq paths silently skipped: 157
          # tests, covering 14 of 16 encodings' Cirq implementations.
          pip install ".[dev,all]"

      - name: Run tests with coverage
        run: pytest --cov=encoding_atlas --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -v -m "not slow"

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ── Job 3: Backend Consistency ─────────────────────────────
  # Guards the multi-framework claim: every encoding must prepare the same
  # state on PennyLane, Qiskit and Cirq. Isolated into its own job so the
  # guarantee has a named, individually-readable result, and run in strict mode
  # so a missing backend fails loudly instead of skipping quietly — the failure
  # mode that let a bit-reversed Qiskit state ship in SO2EquivariantFeatureMap.
  backends:
    name: Backend Consistency
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    env:
      ENCODING_ATLAS_REQUIRE_ALL_BACKENDS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install with all backends
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,all]"

      # Strict mode (set above) turns "backend missing" from a skip into a
      # failure, so passing here means every advertised backend was genuinely
      # exercised — not that its tests quietly declined to run.
      - name: Cross-backend consistency (a missing backend fails, never skips)
        run: pytest tests/integration/test_all_backends_consistency.py tests/unit/encodings/test_qubit_order.py tests/test_backend_policy.py -v -ra

  # ── Job 4: Build Package ───────────────────────────────────
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Job 5: Build Documentation ─────────────────────────────
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      - name: Build MkDocs (strict mode)
        run: mkdocs build --strict
