# .github/workflows/ci.yml
#
# Continuous Integration: runs on every push and pull request.
# Tests the package across Python versions and operating systems,
# enforces code quality (linting, formatting, type checking),
# and verifies the package builds correctly.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff (linting)
        run: ruff check src tests

      - name: Black (formatting)
        run: black --check src tests

      - name: mypy (type checking)
        run: mypy src

  # ── Job 2: Test ─────────────────────────────────────────────
  test:
    name: Test / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install every backend the package advertises. Previously only
          # qiskit was installed, so all Cirq paths silently skipped: 157
          # tests, covering 14 of 16 encodings' Cirq implementations.
          pip install ".[dev,all]"

      - name: Verify all advertised backends are importable
        run: |
          python - <<'EOF'
          import sys

          missing = []
          for backend in ("pennylane", "qiskit", "cirq"):
              try:
                  __import__(backend)
              except ImportError:
                  missing.append(backend)
          if missing:
              print(f"::error::Advertised backends not installed: {missing}. "
                    "Their tests would silently skip and CI would still pass.")
              sys.exit(1)
          print("All advertised backends importable: pennylane, qiskit, cirq")
          EOF

      - name: Run tests with coverage
        run: |
          pytest --cov=encoding_atlas --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -v -m "not slow"

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ── Job 3: Backend Consistency ─────────────────────────────
  # Guards the multi-framework claim: every encoding must prepare the same
  # state on PennyLane, Qiskit and Cirq. Run as its own job with --no-skips so
  # a missing backend fails loudly instead of skipping quietly — the failure
  # mode that let a bit-reversed Qiskit state ship in SO2EquivariantFeatureMap.
  backends:
    name: Backend Consistency
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install with all backends
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,all]"

      - name: Cross-backend consistency (no skips permitted)
        run: |
          python - <<'EOF'
          import re
          import subprocess
          import sys

          targets = [
              "tests/integration/test_all_backends_consistency.py",
              "tests/unit/encodings/test_qubit_order.py",
          ]
          result = subprocess.run(
              [sys.executable, "-m", "pytest", *targets, "-v", "-ra", "--no-header"],
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          if result.stderr:
              print(result.stderr, file=sys.stderr)

          if result.returncode != 0:
              print("::error::Backend consistency tests failed.")
              sys.exit(result.returncode)

          # A skipped backend test means a guarantee went unverified while CI
          # stayed green -- the failure mode that let a bit-reversed Qiskit
          # state ship in SO2EquivariantFeatureMap. Treat any skip as failure.
          lines = [line for line in result.stdout.splitlines() if line.strip()]
          summary = lines[-1] if lines else ""
          skipped = re.search(r"(\d+) skipped", summary)
          if skipped and int(skipped.group(1)) > 0:
              print(f"::error::{skipped.group(1)} backend consistency test(s) "
                    "were skipped, so a backend is missing and its guarantee "
                    "is unverified.")
              sys.exit(1)
          print(f"No skips. All advertised backends verified. ({summary.strip()})")
          EOF

  # ── Job 4: Build Package ───────────────────────────────────
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Job 5: Build Documentation ─────────────────────────────
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      - name: Build MkDocs (strict mode)
        run: mkdocs build --strict
